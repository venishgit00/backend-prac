<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="staff.css">
    <title>Staff Portal - La Maison</title>
</head>
<body>

<div id="app">

    <!-- ─── STAFF LOGIN / REQUEST ─── -->
    <section id="section-login" class="section active">
        <div class="form-container">
            <div class="brand">La Maison</div>
            <div class="auth-tabs">
                <span class="auth-tab active" onclick="switchAuthTab('login')">Sign In</span>
                <span class="auth-tab" onclick="switchAuthTab('register')">Request Access</span>
            </div>
            <div id="authLoginForm">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" required placeholder="staff@cafe.com">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <div id="loginMsg" class="msg"></div>
            </div>
            <div id="authRegisterForm" style="display:none;">
                <p class="form-desc">Submit a request. The owner will be notified and must approve your account.</p>
                <form id="staffRequestForm">
                    <div class="form-group">
                        <label for="reqName">Full Name</label>
                        <input type="text" id="reqName" required placeholder="Jane Staff">
                    </div>
                    <div class="form-group">
                        <label for="reqEmail">Email</label>
                        <input type="email" id="reqEmail" required placeholder="staff@cafe.com">
                    </div>
                    <div class="form-group">
                        <label for="reqPhone">Phone</label>
                        <input type="tel" id="reqPhone" placeholder="+1 234 567 890">
                    </div>
                    <div class="form-group">
                        <label for="reqPassword">Password</label>
                        <input type="password" id="reqPassword" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                    <button type="submit" class="btn btn-primary">Send Request</button>
                </form>
                <div id="staffReqMsg" class="msg"></div>
            </div>
        </div>
    </section>

    <!-- ─── STAFF DASHBOARD ─── -->
    <section id="section-dashboard" class="section">
        <nav class="nav">
            <div class="nav-brand">La Maison</div>
            <div class="nav-user">
                <span id="userInfo"></span>
                <button class="btn btn-danger btn-small" onclick="logout()">Logout</button>
            </div>
        </nav>
        <div class="dashboard">
            <div class="dashboard-header">
                <h2>Staff Dashboard</h2>
                <div id="approvalMsg" class="msg success" style="display:none;">Owner has approved your request.</div>
            </div>
            <div class="dashboard-tabs">
                <button class="tab-btn active" onclick="switchTab('users')">Registered Users</button>
                <button class="tab-btn" onclick="switchTab('bookings')">All Bookings</button>
            </div>
            <div id="tabUsers" class="tab-content active">
                <h3>Registered Users</h3>
                <div id="usersList" class="data-table-wrapper"></div>
            </div>
            <div id="tabBookings" class="tab-content">
                <h3>All Bookings</h3>
                <div id="bookingsList" class="data-table-wrapper"></div>
            </div>
        </div>
    </section>

</div>

<script>
const API = "";
let token = localStorage.getItem("staffToken");
let user = JSON.parse(localStorage.getItem("staffUser") || "null");
let showApproval = false;

function showSection(id) {
  document.querySelectorAll(".section").forEach((s) => s.classList.remove("active"));
  document.getElementById("section-" + id).classList.add("active");
}

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = "msg " + type;
}

function clearMsg(elId) {
  document.getElementById(elId).textContent = "";
  document.getElementById(elId).className = "msg";
}

async function logout() {
  try { await fetch("/api/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }); } catch {}
  localStorage.removeItem("staffToken");
  localStorage.removeItem("staffUser");
  token = null;
  user = null;
  showSection("login");
  document.getElementById("userInfo").textContent = "";
}

// ─── AUTH TAB SWITCHING ───
function switchAuthTab(tab) {
  document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
  if (tab === "login") {
    document.querySelector(".auth-tab:nth-child(1)").classList.add("active");
    document.getElementById("authLoginForm").style.display = "block";
    document.getElementById("authRegisterForm").style.display = "none";
  } else {
    document.querySelector(".auth-tab:nth-child(2)").classList.add("active");
    document.getElementById("authLoginForm").style.display = "none";
    document.getElementById("authRegisterForm").style.display = "block";
  }
}

// ─── LOGIN ───
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg("loginMsg");
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  try {
    const res = await fetch(API + "/api/staff/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      if (data.pending) {
        showMsg("loginMsg", "Your request is pending. Waiting for owner approval.", "info");
      } else {
        showMsg("loginMsg", "Owner has rejected your request.", "error");
      }
      return;
    }
    token = data.token;
    user = data.user;
    localStorage.setItem("staffToken", token);
    localStorage.setItem("staffUser", JSON.stringify(user));
    document.getElementById("userInfo").textContent = user.name + " (staff)";
    if (data.showApproval) {
      showMsg("loginMsg", "Owner has approved your request.", "success");
      setTimeout(() => {
        showApproval = true;
        loadDashboard();
        showSection("dashboard");
      }, 2000);
      return;
    }
    loadDashboard();
    showSection("dashboard");
  } catch {
    showMsg("loginMsg", "Connection error", "error");
  }
});

// ─── STAFF REQUEST ───
document.getElementById("staffRequestForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById("staffReqMsg");
  msgEl.textContent = "";
  msgEl.className = "msg";
  const name = document.getElementById("reqName").value;
  const email = document.getElementById("reqEmail").value;
  const phone = document.getElementById("reqPhone").value;
  const password = document.getElementById("reqPassword").value;
  try {
    const res = await fetch(API + "/api/staff/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password, phone }),
    });
    const data = await res.json();
    if (!res.ok) { msgEl.textContent = data.error; msgEl.className = "msg error"; return; }
    msgEl.textContent = data.message;
    msgEl.className = "msg success";
    document.getElementById("staffRequestForm").reset();
  } catch {
    msgEl.textContent = "Connection error";
    msgEl.className = "msg error";
  }
});

// ─── DASHBOARD ───
async function loadDashboard() {
  const approvalEl = document.getElementById("approvalMsg");
  if (approvalEl) {
    if (showApproval) {
      approvalEl.style.display = "flex";
      setTimeout(() => { approvalEl.style.display = "none"; }, 5000);
    } else {
      approvalEl.style.display = "none";
    }
  }
  try {
    const [usersRes, bookingsRes] = await Promise.all([
      fetch(API + "/api/users/all", { headers: { Authorization: "Bearer " + token } }),
      fetch(API + "/api/bookings/all", { headers: { Authorization: "Bearer " + token } }),
    ]);
    if (!usersRes.ok) throw new Error("Auth failed");
    const users = await usersRes.json();
    const bookings = await bookingsRes.json();

    const usersList = document.getElementById("usersList");
    if (!users.length) {
      usersList.innerHTML = "<p class='empty'>No registered users yet.</p>";
    } else {
      let html = `<table class="data-table"><thead><tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th>
      </tr></thead><tbody>`;
      users.forEach((u) => {
        html += `<tr>
          <td>${u.id}</td>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.phone || "-"}</td>
          <td>${new Date(u.createdAt).toLocaleDateString()}</td>
        </tr>`;
      });
      html += "</tbody></table>";
      usersList.innerHTML = html;
    }

    const bookingsList = document.getElementById("bookingsList");
    if (!bookings.length) {
      bookingsList.innerHTML = "<p class='empty'>No bookings yet.</p>";
    } else {
      let html = `<table class="data-table"><thead><tr>
        <th>ID</th><th>User</th><th>Date</th><th>Time</th><th>Guests</th><th>Table</th><th>Status</th>
      </tr></thead><tbody>`;
      bookings.forEach((b) => {
        html += `<tr>
          <td>${b.id}</td>
          <td>${b.userName}</td>
          <td>${b.date}</td>
          <td>${b.time}</td>
          <td>${b.guests}</td>
          <td>${b.tableLabel || "T" + b.tableId}</td>
          <td><span class="badge ${b.status}">${b.status}</span></td>
        </tr>`;
      });
      html += "</tbody></table>";
      bookingsList.innerHTML = html;
    }
  } catch (err) {
    if (err.message === "Auth failed") {
      logout();
      showMsg("loginMsg", "Session expired. Please login again.", "error");
    }
  }
}

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
  if (tab === "users") {
    document.querySelector(".tab-btn:nth-child(1)").classList.add("active");
    document.getElementById("tabUsers").classList.add("active");
  } else {
    document.querySelector(".tab-btn:nth-child(2)").classList.add("active");
    document.getElementById("tabBookings").classList.add("active");
  }
}

// ─── INIT ───
(async () => {
  try {
    const res = await fetch("/api/auth/me");
    const data = await res.json();
    if (data.user && data.token && data.user.role === "staff") {
      token = data.token;
      user = data.user;
      localStorage.setItem("staffToken", token);
      localStorage.setItem("staffUser", JSON.stringify(user));
    } else {
      localStorage.removeItem("staffToken");
      localStorage.removeItem("staffUser");
      token = null;
      user = null;
    }
  } catch {
    localStorage.removeItem("staffToken");
    localStorage.removeItem("staffUser");
    token = null;
    user = null;
  }
  if (token && user) {
    document.getElementById("userInfo").textContent = user.name + " (staff)";
    loadDashboard();
    showSection("dashboard");
  }
})();
</script>
</body>
</html>
