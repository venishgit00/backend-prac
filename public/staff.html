<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="staff.css">
    <title>Staff Portal - La Maison</title>
</head>
<body>

<div id="app">

    <!-- ─── STAFF LOGIN / REQUEST ─── -->
    <section id="section-login" class="section active">
        <div class="form-container">
            <div class="brand">La Maison</div>
            <div class="auth-tabs">
                <span class="auth-tab active" onclick="switchAuthTab('login')">Sign In</span>
                <span class="auth-tab" onclick="switchAuthTab('register')">Request Access</span>
            </div>
            <div id="authLoginForm">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" required placeholder="staff@cafe.com">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <div id="loginMsg" class="msg"></div>
            </div>
            <div id="authRegisterForm" style="display:none;">
                <p class="form-desc">Submit a request. The owner will be notified and must approve your account.</p>
                <form id="staffRequestForm">
                    <div class="form-group">
                        <label for="reqName">Full Name</label>
                        <input type="text" id="reqName" required placeholder="Jane Staff">
                    </div>
                    <div class="form-group">
                        <label for="reqEmail">Email</label>
                        <input type="email" id="reqEmail" required placeholder="staff@cafe.com">
                    </div>
                    <div class="form-group">
                        <label for="reqPhone">Phone</label>
                        <input type="tel" id="reqPhone" placeholder="+1 234 567 890">
                    </div>
                    <div class="form-group">
                        <label for="reqPassword">Password</label>
                        <input type="password" id="reqPassword" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                    <button type="submit" class="btn btn-primary">Send Request</button>
                </form>
                <div id="staffReqMsg" class="msg"></div>
            </div>
        </div>
    </section>

    <!-- ─── STAFF DASHBOARD ─── -->
    <section id="section-dashboard" class="section">
        <nav class="nav">
            <div class="nav-brand">La Maison</div>
            <div class="nav-user">
                <span id="userInfo"></span>
                <button class="btn btn-danger btn-small" onclick="logout()">Logout</button>
            </div>
        </nav>
        <div class="dashboard">
            <div class="dashboard-header">
                <h2>Staff Dashboard</h2>
                <div id="approvalMsg" class="msg success" style="display:none;">Owner has approved your request.</div>
            </div>
            <div class="dashboard-tabs">
                <button class="tab-btn active" onclick="switchTab('users')">Registered Users</button>
                <button class="tab-btn" onclick="switchTab('bookings')">All Bookings</button>
            </div>
            <div id="tabUsers" class="tab-content active">
                <h3>Registered Users</h3>
                <div id="usersList" class="data-table-wrapper"></div>
            </div>
            <div id="tabBookings" class="tab-content">
                <h3>All Bookings</h3>
                <div id="bookingsList" class="data-table-wrapper"></div>
            </div>
        </div>
    </section>

</div>

<script>
const API = "";
const LS_KEY = "staff_token";
const USER_KEY = "staff_user";
let user = JSON.parse(localStorage.getItem(USER_KEY) || "null");

function showSection(id) {
  document.querySelectorAll(".section").forEach((s) => s.classList.remove("active"));
  document.getElementById("section-" + id).classList.add("active");
}

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = "msg " + type;
}

function clearMsg(elId) {
  document.getElementById(elId).textContent = "";
  document.getElementById(elId).className = "msg";
}

function getToken() { return localStorage.getItem(LS_KEY); }
function setToken(t) { if (t) localStorage.setItem(LS_KEY, t); else localStorage.removeItem(LS_KEY); }
function setUser(u) { if (u) localStorage.setItem(USER_KEY, JSON.stringify(u)); else localStorage.removeItem(USER_KEY); }

async function refreshLogin() {
  const t = getToken();
  if (!t) return false;
  try {
    const res = await fetch("/api/auth/me", { credentials: 'include', headers: { Authorization: "Bearer " + t } });
    const data = await res.json();
    if (data.user && data.user.role === "staff") {
      user = data.user;
      if (data.token) setToken(data.token);
      setUser(user);
      return true;
    }
    if (data.removed) {
      setToken(null); setUser(null); user = null;
      showMsg("loginMsg", "Your access has been revoked by the owner.", "info");
      showSection("login");
      return false;
    }
    setToken(null); setUser(null); user = null;
    return false;
  } catch { return false; }
}

async function logout(msg) {
  try { await fetch("/api/logout", { method: "POST", credentials: 'include' }); } catch {}
  setToken(null);
  setUser(null);
  user = null;
  showSection("login");
  document.getElementById("userInfo").textContent = "";
  ["usersList", "bookingsList"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = "";
  });
  if (msg) showMsg("loginMsg", msg, "error");
}

// ─── AUTH TAB SWITCHING ───
function switchAuthTab(tab) {
  document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
  if (tab === "login") {
    document.querySelector(".auth-tab:nth-child(1)").classList.add("active");
    document.getElementById("authLoginForm").style.display = "block";
    document.getElementById("authRegisterForm").style.display = "none";
  } else {
    document.querySelector(".auth-tab:nth-child(2)").classList.add("active");
    document.getElementById("authLoginForm").style.display = "none";
    document.getElementById("authRegisterForm").style.display = "block";
  }
}

// ─── LOGIN ───
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg("loginMsg");
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  try {
    const res = await fetch(API + "/api/staff/login", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      if (data.pending) {
        showMsg("loginMsg", "Your request is pending. Waiting for owner approval.", "info");
      } else {
        showMsg("loginMsg", data.error || "Login failed", "error");
      }
      return;
    }
    setToken(data.token);
    user = data.user;
    setUser(user);
    document.getElementById("userInfo").textContent = user.name + " (staff)";
    if (data.showApproval) {
      showMsg("loginMsg", "Owner has approved your request.", "success");
      setTimeout(() => { loadDashboard(); showSection("dashboard"); }, 2000);
      return;
    }
    loadDashboard();
    showSection("dashboard");
  } catch {
    showMsg("loginMsg", "Connection error", "error");
  }
});

// ─── STAFF REQUEST ───
document.getElementById("staffRequestForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById("staffReqMsg");
  msgEl.textContent = "";
  msgEl.className = "msg";
  const name = document.getElementById("reqName").value;
  const email = document.getElementById("reqEmail").value;
  const phone = document.getElementById("reqPhone").value;
  const password = document.getElementById("reqPassword").value;
  try {
    const res = await fetch(API + "/api/staff/request", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password, phone }),
    });
    const data = await res.json();
    if (!res.ok) { msgEl.textContent = data.error; msgEl.className = "msg error"; return; }
    msgEl.textContent = data.message;
    msgEl.className = "msg success";
    document.getElementById("staffRequestForm").reset();
  } catch {
    msgEl.textContent = "Connection error";
    msgEl.className = "msg error";
  }
});

// ─── DASHBOARD ───
async function loadSection(url, targetId, renderFn) {
  try {
    const res = await fetch(API + url, {
      credentials: 'include',
      headers: { Authorization: "Bearer " + getToken() },
    });
    if (res.status === 401 || res.status === 403) {
      const ok = await refreshLogin();
      if (ok) {
        const retry = await fetch(API + url, {
          credentials: 'include',
          headers: { Authorization: "Bearer " + getToken() },
        });
        if (retry.ok) { renderFn(await retry.json()); return true; }
      }
      logout("Session expired. Please login again.");
      return false;
    }
    if (!res.ok) {
      document.getElementById(targetId).innerHTML = "<p class='empty' style='color:red'>Failed to load data.</p>";
      return true;
    }
    const data = await res.json();
    renderFn(data);
    return true;
  } catch {
    document.getElementById(targetId).innerHTML = "<p class='empty' style='color:red'>Connection error.</p>";
    return true;
  }
}

function renderUsers(users) {
  const el = document.getElementById("usersList");
  if (!users.length) {
    el.innerHTML = "<p class='empty'>No registered users yet.</p>";
  } else {
    let html = `<table class="data-table"><thead><tr>
      <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th>
    </tr></thead><tbody>`;
    users.forEach((u) => {
      html += `<tr>
        <td>${u.id}</td>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td>${u.phone || "-"}</td>
        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
      </tr>`;
    });
    html += "</tbody></table>";
    el.innerHTML = html;
  }
}

function renderBookings(bookings) {
  const el = document.getElementById("bookingsList");
  if (!bookings.length) {
    el.innerHTML = "<p class='empty'>No bookings yet.</p>";
  } else {
    let html = `<table class="data-table"><thead><tr>
      <th>ID</th><th>User</th><th>Date</th><th>Time</th><th>Guests</th><th>Table</th><th>Status</th><th>Booked At</th>
    </tr></thead><tbody>`;
    bookings.forEach((b) => {
      const bookedAt = new Date(b.createdAt).toLocaleString();
      html += `<tr>
        <td>${b.id}</td>
        <td>${b.userName}</td>
        <td>${b.date}</td>
        <td>${b.time}</td>
        <td>${b.guests}</td>
        <td>${b.tableLabel || "T" + b.tableId}</td>
        <td><span class="badge ${b.status}">${b.status}</span></td>
        <td>${bookedAt}</td>
      </tr>`;
    });
    html += "</tbody></table>";
    el.innerHTML = html;
  }
}

async function loadDashboard() {
  const approvalEl = document.getElementById("approvalMsg");
  if (approvalEl) {
    approvalEl.style.display = "none";
  }
  await loadSection("/api/users/all", "usersList", renderUsers);
  await loadSection("/api/bookings/all", "bookingsList", renderBookings);
}

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
  if (tab === "users") {
    document.querySelector(".tab-btn:nth-child(1)").classList.add("active");
    document.getElementById("tabUsers").classList.add("active");
  } else {
    document.querySelector(".tab-btn:nth-child(2)").classList.add("active");
    document.getElementById("tabBookings").classList.add("active");
  }
}

// ─── INIT ───
(async () => {
  const savedToken = getToken();
  if (savedToken) {
    try {
      const res = await fetch("/api/auth/me", {
        credentials: 'include',
        headers: { Authorization: "Bearer " + savedToken },
      });
      const data = await res.json();
      if (data.user && data.user.role === "staff") {
        user = data.user;
        if (data.token) setToken(data.token);
        setUser(user);
      } else if (data.removed) {
        setToken(null); setUser(null); user = null;
        showMsg("loginMsg", "Your access has been revoked by the owner.", "info");
      } else {
        setToken(null); setUser(null); user = null;
      }
    } catch {
      if (!user) { setToken(null); setUser(null); }
    }
  }
  if (user) {
    document.getElementById("userInfo").textContent = user.name + " (staff)";
    loadDashboard();
    showSection("dashboard");
  }
})();

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && getToken() && user) {
    refreshLogin();
  }
});

setInterval(() => {
  if (getToken() && user) {
    refreshLogin();
  }
}, 300000);
</script>
</body>
</html>
