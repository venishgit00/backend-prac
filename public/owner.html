<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="owner.css">
    <title>Owner Portal - La Maison</title>
</head>
<body>

<div id="app">

    <!-- ─── OWNER LOGIN ─── -->
    <section id="section-login" class="section active">
        <div class="form-container">
            <div class="brand">La Maison</div>
            <div class="auth-tabs">
                <span class="auth-tab active" onclick="switchAuthTab('login')">Sign In</span>
                <span class="auth-tab" onclick="switchAuthTab('register')">Info</span>
            </div>
            <div id="authLoginForm">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" value="owner@cafe.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <div id="loginMsg" class="msg"></div>
            </div>
            <div id="authRegisterForm" style="display:none;">
                <p class="form-desc">Owner account is pre-configured.</p>
                <p class="form-desc">Email: <strong>owner@cafe.com</strong></p>
                <p class="form-desc">Password: <strong>owner123</strong></p>
            </div>
        </div>
    </section>

    <!-- ─── OWNER DASHBOARD ─── -->
    <section id="section-dashboard" class="section">
        <nav class="nav">
            <div class="nav-brand">La Maison</div>
            <div class="nav-user">
                <span id="userInfo"></span>
                <button class="btn btn-danger btn-small" onclick="logout()">Logout</button>
            </div>
        </nav>
        <div class="dashboard">
            <div class="dashboard-header">
                <h2>Owner Dashboard</h2>
            </div>
            <div class="dashboard-tabs">
                <button class="tab-btn active" onclick="switchTab('users')">Users</button>
                <button class="tab-btn" onclick="switchTab('bookings')">Bookings</button>
                <button class="tab-btn" onclick="switchTab('pending')">Pending Staff</button>
                <button class="tab-btn" onclick="switchTab('staff')">Manage Staff</button>
                <button class="tab-btn" onclick="switchTab('add')">Add Staff</button>
                <button class="tab-btn" onclick="switchTab('offers')">Offers</button>
            </div>
            <div id="tabUsers" class="tab-content active">
                <h3>All Users</h3>
                <div id="usersList" class="data-table-wrapper"></div>
            </div>
            <div id="tabBookings" class="tab-content">
                <h3>All Bookings</h3>
                <div id="bookingsList" class="data-table-wrapper"></div>
            </div>
            <div id="tabPending" class="tab-content">
                <h3>Staff Approval Requests</h3>
                <div id="pendingList" class="data-table-wrapper"></div>
            </div>
            <div id="tabStaff" class="tab-content">
                <h3>All Staff Members</h3>
                <div id="staffList" class="data-table-wrapper"></div>
            </div>
            <div id="tabAdd" class="tab-content">
                <h3>Add New Staff Member</h3>
                <form id="addStaffForm" class="compact-form">
                    <div class="form-group">
                        <label for="addStaffName">Name</label>
                        <input type="text" id="addStaffName" required>
                    </div>
                    <div class="form-group">
                        <label for="addStaffEmail">Email</label>
                        <input type="email" id="addStaffEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="addStaffPhone">Phone</label>
                        <input type="tel" id="addStaffPhone" pattern="[0-9]{10}" title="Phone number must be exactly 10 digits">
                    </div>
                    <div class="form-group">
                        <label for="addStaffPassword">Password</label>
                        <input type="password" id="addStaffPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Staff</button>
                </form>
                <div id="addStaffMsg" class="msg"></div>
            </div>

            <!-- ─── OFFERS TAB ─── -->
            <div id="tabOffers" class="tab-content">
                <h3>Manage Offers Carousel</h3>
                <div id="offersList" class="offers-grid"></div>
                <div id="offersMsg" class="msg"></div>
            </div>
        </div>
    </section>

</div>

<script>
const API = "";
let token = localStorage.getItem("ownerToken");
let user = null;
try { user = JSON.parse(localStorage.getItem("ownerUser")) || null; } catch {}

function esc(str) { const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }

function showSection(id) {
  document.querySelectorAll(".section").forEach((s) => s.classList.remove("active"));
  document.getElementById("section-" + id).classList.add("active");
}

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = "msg " + type;
}

function clearMsg(elId) {
  document.getElementById(elId).textContent = "";
  document.getElementById(elId).className = "msg";
}

async function logout() {
  try { await fetch("/api/logout", { method: "POST", credentials: 'include', headers: { Authorization: "Bearer " + token } }); } catch {}
  localStorage.removeItem("ownerToken");
  localStorage.removeItem("ownerUser");
  token = null;
  user = null;
  showSection("login");
  document.getElementById("userInfo").textContent = "";
  // Clear dashboard data by reloading - safer than manipulating innerHTML
}

// ─── AUTH TAB SWITCHING ───
function switchAuthTab(tab) {
  document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
  if (tab === "login") {
    document.querySelector(".auth-tab:nth-child(1)").classList.add("active");
    document.getElementById("authLoginForm").style.display = "block";
    document.getElementById("authRegisterForm").style.display = "none";
  } else {
    document.querySelector(".auth-tab:nth-child(2)").classList.add("active");
    document.getElementById("authLoginForm").style.display = "none";
    document.getElementById("authRegisterForm").style.display = "block";
  }
}

// ─── LOGIN ───
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg("loginMsg");
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  try {
    const res = await fetch(API + "/api/owner/login", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) return showMsg("loginMsg", data.error, "error");
    token = data.token;
    user = data.user;
    localStorage.setItem("ownerToken", token);
    localStorage.setItem("ownerUser", JSON.stringify(user));
    document.getElementById("userInfo").textContent = "Owner";
    loadDashboard();
    showSection("dashboard");
  } catch {
    showMsg("loginMsg", "Connection error", "error");
  }
});

// ─── DASHBOARD ───
async function loadSection(url, targetId, renderFn) {
  try {
    const res = await fetch(API + url, { credentials: 'include', headers: { Authorization: "Bearer " + token } });
    if (res.status === 401 || res.status === 403) {
      logout();
      showMsg("loginMsg", "Session expired. Please login again.", "error");
      return false;
    }
    if (!res.ok) {
      document.getElementById(targetId).innerHTML = "<p class='empty' style='color:red'>Failed to load data.</p>";
      return true;
    }
    const data = await res.json();
    renderFn(data);
    return true;
  } catch {
    document.getElementById(targetId).innerHTML = "<p class='empty' style='color:red'>Connection error.</p>";
    return true;
  }
}

function renderUsers(users) {
  const el = document.getElementById("usersList");
  if (!users.length) {
    el.innerHTML = "<p class='empty'>No registered users.</p>";
  } else {
    let html = `<table class="data-table"><thead><tr>
      <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th>
    </tr></thead><tbody>`;
    users.forEach((u) => {
      html += `<tr>
        <td>${esc(u.id)}</td>
        <td>${esc(u.name)}</td>
        <td>${esc(u.email)}</td>
        <td>${esc(u.phone || "-")}</td>
        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
      </tr>`;
    });
    html += "</tbody></table>";
    el.innerHTML = html;
  }
}

function renderBookings(bookings) {
  const el = document.getElementById("bookingsList");
  if (!bookings.length) {
    el.innerHTML = "<p class='empty'>No bookings yet.</p>";
  } else {
    let html = `<table class="data-table"><thead><tr>
      <th>ID</th><th>User</th><th>Date</th><th>Time</th><th>Guests</th><th>Table</th><th>Status</th><th>Booked At</th>
    </tr></thead><tbody>`;
    bookings.forEach((b) => {
      const bookedAt = new Date(b.createdAt).toLocaleString();
      html += `<tr>
        <td>${esc(b.id)}</td>
        <td>${esc(b.userName)}</td>
        <td>${esc(b.date)}</td>
        <td>${esc(b.time)}</td>
        <td>${esc(b.guests)}</td>
        <td>${esc(b.tableLabel || "T" + b.tableId)}</td>
        <td><span class="badge ${esc(b.status)}">${esc(b.status)}</span></td>
        <td>${esc(bookedAt)}</td>
      </tr>`;
    });
    html += "</tbody></table>";
    el.innerHTML = html;
  }
}

function renderPendingStaff(pending) {
  const el = document.getElementById("pendingList");
  if (!pending.length) {
    el.innerHTML = "<p class='empty'>No pending staff requests.</p>";
  } else {
    el.innerHTML = "";
    pending.forEach((s) => {
      const div = document.createElement("div");
      div.className = "pending-request";
      div.innerHTML = `
        <div>
          <strong>${esc(s.name)}</strong> (${esc(s.email)})<br>
          <small>Phone: ${esc(s.phone || "-")} | Requested: ${new Date(s.createdAt).toLocaleDateString()}</small>
        </div>
        <div class="actions">
          <button class="btn btn-success btn-small" onclick="approveStaff(${s.id})">Approve</button>
          <button class="btn btn-danger btn-small" onclick="rejectStaff(${s.id})">Reject</button>
        </div>
      `;
      el.appendChild(div);
    });
  }
}

function renderAllStaff(allStaff) {
  const el = document.getElementById("staffList");
  if (!allStaff.length) {
    el.innerHTML = "<p class='empty'>No staff members.</p>";
  } else {
    let html = `<table class="data-table"><thead><tr>
      <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Added</th><th>Actions</th>
    </tr></thead><tbody>`;
    allStaff.forEach((s) => {
      html += `<tr>
        <td>${esc(s.id)}</td>
        <td>${esc(s.name)}</td>
        <td>${esc(s.email)}</td>
        <td>${esc(s.phone || "-")}</td>
        <td><span class="badge ${esc(s.status)}">${esc(s.status)}</span></td>
        <td>${new Date(s.createdAt).toLocaleDateString()}</td>
        <td>
          <button class="btn btn-danger btn-small" data-staff-id="${s.id}" data-staff-name="${esc(s.name)}">Remove</button>
        </td>
      </tr>`;
    });
    html += "</tbody></table>";
    el.innerHTML = html;
    el.querySelectorAll("[data-staff-id]").forEach((btn) => {
      btn.addEventListener("click", () => removeStaff(btn.dataset.staffId, btn.dataset.staffName));
    });
  }
}

async function loadDashboard() {
  const ok = await loadSection("/api/users/all", "usersList", renderUsers);
  if (ok === false) return;
  await Promise.all([
    loadSection("/api/bookings/all", "bookingsList", renderBookings),
    loadSection("/api/staff/pending", "pendingList", renderPendingStaff),
    loadSection("/api/staff/all", "staffList", renderAllStaff),
  ]);
  loadOffersManager();
}

async function approveStaff(id) {
  try {
    const res = await fetch(API + "/api/staff/approve", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ staffId: id }),
    });
    if (!res.ok) return alert((await res.json()).error);
    loadDashboard();
  } catch {
    alert("Error approving staff");
  }
}

async function rejectStaff(id) {
  try {
    const res = await fetch(API + "/api/staff/reject", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ staffId: id }),
    });
    if (!res.ok) return alert((await res.json()).error);
    loadDashboard();
  } catch {
    alert("Error rejecting staff");
  }
}

async function removeStaff(id, name) {
  if (!confirm(`Remove staff member "${name}"? This cannot be undone.`)) return;
  try {
    const res = await fetch(API + "/api/staff/remove", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ staffId: id }),
    });
    if (!res.ok) return alert((await res.json()).error);
    loadDashboard();
  } catch {
    alert("Error removing staff");
  }
}

async function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
  const btns = document.querySelectorAll(".tab-btn");
  const tabs = ["users", "bookings", "pending", "staff", "add", "offers"];
  const idx = tabs.indexOf(tab);
  if (idx >= 0) {
    btns[idx].classList.add("active");
    document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
    if (tab === "staff") {
      loadSection("/api/staff/all", "staffList", renderAllStaff);
    } else if (tab === "pending") {
      loadSection("/api/staff/pending", "pendingList", renderPendingStaff);
    } else if (tab === "users") {
      loadSection("/api/users/all", "usersList", renderUsers);
    } else if (tab === "bookings") {
      loadSection("/api/bookings/all", "bookingsList", renderBookings);
    }
  }
}

// ─── ADD STAFF ───
document.getElementById("addStaffForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg("addStaffMsg");
  const name = document.getElementById("addStaffName").value;
  const email = document.getElementById("addStaffEmail").value;
  const phone = document.getElementById("addStaffPhone").value;
  const password = document.getElementById("addStaffPassword").value;
  if (phone && !/^\d{10}$/.test(phone))
    return showMsg("addStaffMsg", "Phone number must be exactly 10 digits", "error");
  try {
    const res = await fetch(API + "/api/staff/register", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ name, email, password, phone }),
    });
    const data = await res.json();
    if (!res.ok) return showMsg("addStaffMsg", data.error, "error");
    showMsg("addStaffMsg", "Staff " + data.staff.name + " added successfully!", "success");
    document.getElementById("addStaffForm").reset();
    loadDashboard();
  } catch {
    showMsg("addStaffMsg", "Connection error", "error");
  }
});

// ─── OFFERS MANAGEMENT ───

function showOffersMsg(text, type) {
  const el = document.getElementById("offersMsg");
  el.textContent = text;
  el.className = "msg " + type;
}

async function loadOffersManager() {
  try {
    const res = await fetch("/api/offers", { credentials: 'include' });
    const data = await res.json();
    const container = document.getElementById("offersList");
    container.innerHTML = "";
    data.offers.forEach((offer) => {
      const card = document.createElement("div");
      card.className = "offer-card";
      const imgSrc = offer.image || "";
      card.innerHTML = `
        <div class="offer-img-area" data-slot="${offer.slot}">
          ${imgSrc ? `<img src="${imgSrc}" class="offer-current-img">` : `<div class="offer-no-img">Drop image here or click to browse</div>`}
        </div>
        <div class="offer-fields">
          <label>Label</label>
          <input type="text" class="offer-label-input" value="${offer.label}">
          <input type="file" class="offer-file-input" accept="image/*" data-slot="${offer.slot}" style="display:none;">
          <div class="offer-actions">
            <button class="btn btn-primary btn-small" onclick="saveOffer(${offer.slot})">Save</button>
            ${imgSrc ? `<button class="btn btn-danger btn-small" onclick="removeOfferImage(${offer.slot})">Remove Image</button>` : ""}
          </div>
        </div>
      `;
      container.appendChild(card);

      const imgArea = card.querySelector(".offer-img-area");
      const fileInput = card.querySelector(".offer-file-input");

      imgArea.addEventListener("click", () => fileInput.click());

      imgArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        imgArea.style.borderColor = "#c9a96e";
        imgArea.style.background = "rgba(201,169,110,0.1)";
      });
      imgArea.addEventListener("dragleave", () => {
        imgArea.style.borderColor = "#444";
        imgArea.style.background = "transparent";
      });
      imgArea.addEventListener("drop", (e) => {
        e.preventDefault();
        imgArea.style.borderColor = "#444";
        imgArea.style.background = "transparent";
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) {
          fileInput.files = e.dataTransfer.files;
          const reader = new FileReader();
          reader.onload = (ev) => {
            imgArea.innerHTML = `<img src="${ev.target.result}" class="offer-current-img">`;
          };
          reader.readAsDataURL(file);
        }
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            imgArea.innerHTML = `<img src="${e.target.result}" class="offer-current-img">`;
          };
          reader.readAsDataURL(fileInput.files[0]);
        }
      });
    });
  } catch {
    showOffersMsg("Error loading offers", "error");
  }
}

async function saveOffer(slot) {
  const cards = document.querySelectorAll(".offer-card");
  const card = cards[slot];
  const labelInput = card.querySelector(".offer-label-input");
  const fileInput = card.querySelector(".offer-file-input");
  const body = { slot, label: labelInput.value };
  if (fileInput.files[0]) {
    body.image = await toBase64(fileInput.files[0]);
  }
  try {
    const res = await fetch("/api/offers/update", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) return showOffersMsg(data.error, "error");
    showOffersMsg("Offer saved!", "success");
    loadOffersManager();
  } catch {
    showOffersMsg("Error saving offer", "error");
  }
}

async function removeOfferImage(slot) {
  try {
    const res = await fetch("/api/offers/remove-image", {
      method: "POST",
      credentials: 'include',
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ slot }),
    });
    const data = await res.json();
    if (!res.ok) return showOffersMsg(data.error, "error");
    showOffersMsg("Image removed", "success");
    loadOffersManager();
  } catch {
    showOffersMsg("Error removing image", "error");
  }
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ─── INIT ───
(async () => {
  // Optimistic render from cached data
  if (user && token) {
    document.getElementById("userInfo").textContent = "Owner";
    loadDashboard();
    showSection("dashboard");
  }
  // Always verify with server — the httpOnly cookie can restore the session
  try {
    const headers = {};
    if (token) headers.Authorization = "Bearer " + token;
    const res = await fetch("/api/auth/me", { credentials: 'include', headers });
    const data = await res.json();
    if (data.user && data.token && data.user.role === "owner") {
      token = data.token;
      user = data.user;
      localStorage.setItem("ownerToken", token);
      localStorage.setItem("ownerUser", JSON.stringify(user));
      document.getElementById("userInfo").textContent = "Owner";
      if (!document.getElementById("section-dashboard").classList.contains("active")) {
        loadDashboard();
        showSection("dashboard");
      }
    } else if (user) {
      localStorage.removeItem("ownerToken");
      localStorage.removeItem("ownerUser");
      token = null;
      user = null;
      showMsg("loginMsg", "Session expired. Please login again.", "info");
      showSection("login");
    }
  } catch {
    if (!user || !token) {
      showSection("login");
    }
  }
})();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    const headers = {};
    if (token) headers.Authorization = "Bearer " + token;
    fetch("/api/auth/me", { credentials: 'include', headers }).then(async (res) => {
      const data = await res.json();
      if (data.user && data.token && data.user.role === "owner") {
        token = data.token;
        user = data.user;
        localStorage.setItem("ownerToken", token);
        localStorage.setItem("ownerUser", JSON.stringify(user));
      } else if (!data.user || data.user.role !== "owner") {
        if (token || user) logout();
      }
    }).catch(() => {});
  }
});
setInterval(async () => {
  const headers = {};
  if (token) headers.Authorization = "Bearer " + token;
  try {
    const res = await fetch("/api/auth/me", { credentials: 'include', headers });
    const data = await res.json();
    if (data.user && data.token && data.user.role === "owner") {
      token = data.token;
      user = data.user;
      localStorage.setItem("ownerToken", token);
      localStorage.setItem("ownerUser", JSON.stringify(user));
    } else if (!data.user || data.user.role !== "owner") {
      if (token || user) logout();
    }
  } catch { /* ignore network errors */ }
}, 300000);
</script>
</body>
</html>
